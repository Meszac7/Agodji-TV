name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualité (lint, types, tests unitaires, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          APP_ENV: development

  database:
    name: Base de données (migrations, verrouillage, règles)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:db
        env:
          TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres

  e2e:
    name: Parcours navigateur (mobile et ordinateur)
    runs-on: ubuntu-24.04
    # Base de démonstration pour le site réel (catalogue, fiche série, lecteur) — jamais de données de production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Les serveurs de paquets Ubuntu renvoient parfois 503 : on réessaie, puis on installe
      # le navigateur seul (les bibliothèques système sont déjà présentes sur ubuntu-latest).
      - name: Installer Chromium (avec reprises)
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Tentative $i échouée, nouvel essai dans 20 s"; sleep 20
          done
          npx playwright install chromium
      - run: npm run db:migrate -- --demo
        env:
          APP_ENV: development
      - run: npm run build
        env:
          APP_ENV: development
      - run: npm run test:e2e
        env:
          APP_ENV: development
